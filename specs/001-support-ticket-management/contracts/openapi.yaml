openapi: 3.0.3
info:
  title: Support Ticket Management API
  version: 1.0.0
  description: REST API for support ticket lifecycle, comments, search, and filter.
servers:
  - url: http://localhost:8080
    description: Local backend
tags:
  - name: tickets
  - name: comments
paths:
  /api/v1/tickets:
    get:
      tags: [tickets]
      summary: List tickets with optional status filter and keyword search
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match on title or description when a search keyword is applied (FR-007). Empty-keyword behavior is not specified in the product spec; see implementation plan for the default handling of omitted or blank values.
          schema:
            type: string
      responses:
        '200':
          description: Ticket summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketSummary'
    post:
      tags: [tickets]
      summary: Create a ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/tickets/{ticketId}:
    get:
      tags: [tickets]
      summary: Get ticket by id
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Ticket detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [tickets]
      summary: Partial update of ticket fields (never changes status)
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/tickets/{ticketId}/transitions:
    post:
      tags: [tickets]
      summary: Apply a status transition
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: Ticket after transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/tickets/{ticketId}/comments:
    post:
      tags: [comments]
      summary: Add a comment to a ticket
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Created comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  parameters:
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    TicketPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    TicketStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED, CANCELLED]
    CreateTicketRequest:
      type: object
      required: [title, description, priority]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        priority:
          $ref: '#/components/schemas/TicketPriority'
        assignee:
          type: string
          nullable: true
    UpdateTicketRequest:
      type: object
      description: Only included fields are updated. Use assignee null to clear.
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        priority:
          $ref: '#/components/schemas/TicketPriority'
        assignee:
          type: string
          nullable: true
    TransitionRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TicketStatus'
    CreateCommentRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
    TicketSummary:
      type: object
      required: [id, title, status]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        status:
          $ref: '#/components/schemas/TicketStatus'
    Comment:
      type: object
      required: [id, content]
      properties:
        id:
          type: integer
          format: int64
        content:
          type: string
    Ticket:
      type: object
      required: [id, title, description, priority, status, comments]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        priority:
          $ref: '#/components/schemas/TicketPriority'
        assignee:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/TicketStatus'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
    ProblemDetail:
      type: object
      description: RFC 7807 problem detail with stable code extension
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine-readable error code
        currentStatus:
          $ref: '#/components/schemas/TicketStatus'
        requestedStatus:
          $ref: '#/components/schemas/TicketStatus'
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
  responses:
    NotFound:
      description: Ticket not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            status: 404
            title: Not Found
            detail: Ticket not found
            code: TICKET_NOT_FOUND
    ValidationError:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            status: 422
            title: Validation Failed
            detail: One or more fields are invalid
            code: VALIDATION_ERROR
    InvalidTransition:
      description: Status transition not allowed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            status: 409
            title: Conflict
            detail: Status transition is not allowed
            code: INVALID_STATUS_TRANSITION
            currentStatus: CLOSED
            requestedStatus: OPEN
