services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: support_tickets
      POSTGRES_USER: support_tickets
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
